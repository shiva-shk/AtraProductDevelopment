<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atra Product Development Pipeline</title>
<style>
  :root {
    --red: #D10917;
    --black: #111111;
    --gray: #929291;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    background: var(--black);
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 8px;
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
  }
  .card h1 {
    font-size: 18px;
    margin: 18px 0 6px 0;
    color: var(--black);
  }
  .card p {
    font-size: 13px;
    color: var(--gray);
    margin: 0 0 22px 0;
    line-height: 1.5;
  }
  input[type="text"] {
    width: 100%;
    padding: 11px 12px;
    font-size: 14px;
    border: 1px solid #ddd;
    border-radius: 5px;
    font-family: inherit;
    margin-bottom: 14px;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--red);
  }
  button {
    width: 100%;
    padding: 11px 12px;
    font-size: 14px;
    font-weight: 700;
    border: none;
    border-radius: 5px;
    background: var(--red);
    color: #fff;
    cursor: pointer;
  }
  button:disabled { background: #e5a3a8; cursor: default; }
  .err {
    color: var(--red);
    font-size: 12px;
    margin-top: 8px;
    min-height: 16px;
  }
  .badge {
    display: inline-block;
    background: var(--black);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 5px 12px;
    border-radius: 3px;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">ATRA PIPELINE</span>
    <h1>Product Development Pipeline</h1>
    <p>Enter your name to continue to the dashboard.</p>
    <form id="gateForm">
      <input type="text" id="nameInput" placeholder="Your full name" autocomplete="name" autofocus>
      <button type="submit" id="submitBtn">Continue</button>
      <div class="err" id="errMsg"></div>
    </form>
  </div>

<script>
  // Paste the Google Apps Script Web App URL here (see setup instructions).
  const LOG_URL = "https://script.google.com/macros/s/AKfycbxtjxYCahaFRNf753r5RPGw1r_ZjQ8atPs9TdYvNedpOw_JDZGcBapZQzm2IUgNTkdnZA/exec";
  const DASHBOARD_PAGE = "dashboard.html";

  const form = document.getElementById('gateForm');
  const input = document.getElementById('nameInput');
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('errMsg');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const name = input.value.trim();
    if (!name) {
      err.textContent = 'Please enter your name.';
      return;
    }
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Loading…';

    sessionStorage.setItem('atra_visitor_name', name);

    const proceed = function () {
      window.location.href = DASHBOARD_PAGE;
    };

    if (LOG_URL && LOG_URL.indexOf('PASTE_YOUR') === -1) {
      const url = LOG_URL + '?name=' + encodeURIComponent(name)
        + '&ua=' + encodeURIComponent(navigator.userAgent);
      fetch(url, { mode: 'no-cors' })
        .then(proceed)
        .catch(proceed);
      // Safety net: proceed even if the log request hangs.
      setTimeout(proceed, 2500);
    } else {
      proceed();
    }
  });
</script>
</body>
</html>
